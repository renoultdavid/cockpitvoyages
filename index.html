<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cockpit Voyage - Globe 3D & Carte Rando HD</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Leaflet 2D HD -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet MarkerCluster -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

  <!-- Globe.gl 3D -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.7);
    }

    .globe-marker-anchor {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      width: 0;
      height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes radar-pulse {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    .marker-radar {
      animation: radar-pulse 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .custom-cluster-icon {
      background: rgba(14, 116, 144, 0.95);
      border: 2px solid #22d3ee;
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(34, 211, 238, 0.6);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="relative w-full h-full bg-slate-950 font-sans antialiased text-slate-100 overflow-hidden">

  <!-- 3D Globe Viewport -->
  <div id="globe-view" class="absolute inset-0 w-full h-full z-0 transition-opacity duration-500 opacity-100 pointer-events-auto">
    <div id="globe-container" class="w-full h-full"></div>
    <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
      <div class="relative w-10 h-10 rounded-full border border-cyan-400/25 flex items-center justify-center opacity-30">
        <div class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]"></div>
        <div class="absolute -top-1.5 w-0.5 h-1.5 bg-cyan-400/50"></div>
        <div class="absolute -bottom-1.5 w-0.5 h-1.5 bg-cyan-400/50"></div>
        <div class="absolute -left-1.5 w-1.5 h-0.5 bg-cyan-400/50"></div>
        <div class="absolute -right-1.5 w-1.5 h-0.5 bg-cyan-400/50"></div>
      </div>
    </div>
  </div>

  <!-- 2D Leaflet Viewport -->
  <div id="map-view" class="absolute inset-0 w-full h-full z-0 transition-opacity duration-500 opacity-0 pointer-events-none bg-slate-950">
    <div id="leaflet-container" class="w-full h-full"></div>
  </div>

  <!-- Top Header Navigation & Mode Switchers -->
  <header class="absolute top-3 left-3 right-3 z-30 flex items-center justify-between pointer-events-none">
    <div class="flex items-center gap-2 pointer-events-auto">
      <div class="glass-panel px-3 py-2 rounded-2xl flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/25 text-white">
          <i id="header-mode-icon" class="fa-solid fa-earth-africa text-xs"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
            Cockpit Voyage <span class="text-cyan-400 font-mono text-[10px] px-1.5 py-0.5 rounded bg-cyan-950/80 border border-cyan-500/30">HD</span>
          </h1>
          <p id="header-subtitle" class="text-[10px] text-slate-400">Vue planétaire 3D</p>
        </div>
      </div>

      <div class="glass-panel p-1 rounded-2xl flex items-center shadow-lg">
        <button id="btn-mode-globe" onclick="setViewingMode('globe')" class="px-3 py-1 rounded-xl text-xs font-semibold transition-all duration-200 bg-cyan-500 text-white shadow">
          <i class="fa-solid fa-globe mr-1"></i> 3D
        </button>
        <button id="btn-mode-map" onclick="setViewingMode('map')" class="px-3 py-1 rounded-xl text-xs font-semibold transition-all duration-200 text-slate-300 hover:text-white">
          <i class="fa-solid fa-map mr-1"></i> Carte HD
        </button>
      </div>
    </div>

    <div class="flex items-center gap-1.5 pointer-events-auto glass-panel px-2.5 py-1.5 rounded-2xl">
      <button onclick="flyToSpotCoordinates(27.2579, 33.8116, 12)" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-cyan-500/25 hover:bg-cyan-500/35 text-cyan-300 border border-cyan-500/40 transition flex items-center gap-1">
        <span>🐠</span> Égypte (Mer Rouge)
      </button>
      <button onclick="resetGlobalView()" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center gap-1" title="Vue globale planète 3D">
        <i class="fa-solid fa-globe"></i> Globe
      </button>
    </div>
  </header>

  <!-- Left Sidebar: Filters with Section Headers & Select All / None -->
  <aside id="left-filters" class="absolute top-16 left-3 z-30 flex flex-col gap-2 w-56 sm:w-60 pointer-events-auto max-h-[calc(100vh-6rem)] overflow-y-auto no-scrollbar">
    <div class="glass-panel rounded-2xl p-3 shadow-2xl">
      <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-700/60">
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-filter text-cyan-400 text-xs"></i>
          <h2 class="text-xs font-bold tracking-wide uppercase text-slate-200">Filtres Visite</h2>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="setAllFilters(true)" class="text-[10px] text-cyan-400 hover:text-cyan-300 font-semibold underline">Tout</button>
          <span class="text-slate-600 text-[10px]">·</span>
          <button onclick="setAllFilters(false)" class="text-[10px] text-slate-400 hover:text-rose-400 font-semibold underline">Aucun</button>
        </div>
      </div>
      <div id="category-toggles" class="space-y-1 text-xs"></div>
    </div>
  </aside>

  <!-- Right Narrow HUD: Vertical Tall Counters with Section Dividers -->
  <aside id="right-narrow-hud" class="absolute top-16 right-3 z-30 flex flex-col items-end pointer-events-auto w-16">
    <div class="glass-panel rounded-2xl py-2 px-2 shadow-2xl flex flex-col items-center gap-1.5 max-h-[calc(100vh-6rem)] overflow-y-auto no-scrollbar border-slate-700/60 w-16">
      <div class="w-full py-1.5 rounded-xl bg-cyan-950/80 border border-cyan-500/40 flex flex-col items-center justify-center text-center shadow-inner" title="Total des sites visités">
        <i class="fa-solid fa-map-pin text-cyan-400 text-[11px] mb-0.5"></i>
        <span id="stat-total" class="font-mono font-black text-cyan-300 text-xs leading-none">0</span>
      </div>
      <div class="w-8 h-[1px] bg-slate-700/60 my-0.5"></div>
      <div id="narrow-hud-list" class="flex flex-col gap-1 w-full items-center"></div>
    </div>
  </aside>

  <!-- Independent Floating Destination Card (Bottom Right, Separated from Sidebar) -->
  <section id="destination-card" class="absolute bottom-4 right-20 z-40 glass-panel rounded-2xl p-3 shadow-2xl border-cyan-500/40 hidden pointer-events-auto transition-all duration-300 w-80 sm:w-96 flex flex-col justify-between">
    <div class="relative flex flex-col gap-2.5">
      <button onclick="closeSpotCard()" class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-slate-900/90 hover:bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-xs transition z-10 border border-slate-700">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="w-full h-36 rounded-xl overflow-hidden bg-slate-900 shrink-0 relative border border-slate-700/50">
        <img id="card-img" src="" alt="Aperçu destination" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x200/0f172a/38bdf8?text=Voyage'">
        <div id="card-badge" class="absolute bottom-2 left-2 px-2 py-0.5 rounded text-[10px] font-bold text-white uppercase tracking-wider backdrop-blur-md"></div>
      </div>

      <div>
        <h3 id="card-title" class="text-xs sm:text-sm font-bold text-white pr-4"></h3>
        <p id="card-location" class="text-[10px] text-cyan-400 font-medium flex items-center gap-1 mt-0.5">
          <i class="fa-solid fa-location-dot"></i> <span></span>
        </p>
        <p id="card-description" class="text-[11px] text-slate-300 leading-tight my-2"></p>
      </div>
    </div>

    <div class="flex flex-col gap-2 pt-2 border-t border-slate-700/60 mt-auto">
      <a id="card-link" href="#" target="_blank" rel="noopener noreferrer" class="w-full py-2 px-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-[11px] font-semibold flex items-center justify-center gap-1.5 shadow-md shadow-cyan-500/20 transition">
        <i class="fa-solid fa-images text-[10px]"></i>
        <span>Voir l'album photo</span>
        <i class="fa-solid fa-arrow-up-right-from-square text-[9px] opacity-75"></i>
      </a>
      <button id="card-btn-mode-toggle" onclick="toggleCurrentSpotViewMode()" class="w-full py-2 px-3 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 text-[11px] font-medium flex items-center justify-center gap-1.5 border border-slate-700 transition">
        <i id="card-btn-icon" class="fa-solid fa-map-location-dot text-cyan-400 text-[10px]"></i>
        <span id="card-btn-label">Explorer en 2D</span>
      </button>
    </div>
  </section>

  <!-- Bottom Left Interactive Controls -->
  <div class="absolute bottom-4 left-3 z-30 flex flex-col gap-1.5 pointer-events-auto">
    <button id="btn-toggle-tiles" onclick="toggleMapTileLayer()" class="glass-panel w-9 h-9 rounded-xl flex items-center justify-center text-cyan-300 hover:text-white transition shadow-lg hidden" title="Basculer Satellite / Topo">
      <i class="fa-solid fa-layer-group text-xs"></i>
    </button>
    <button id="btn-toggle-rotate" onclick="toggleGlobeAutoRotate()" class="glass-panel w-9 h-9 rounded-xl flex items-center justify-center text-cyan-300 hover:text-white transition shadow-lg" title="Activer / Arrêter la rotation">
      <i id="icon-auto-rotate" class="fa-solid fa-pause text-xs"></i>
    </button>
    <button onclick="zoomMapIn()" class="glass-panel w-9 h-9 rounded-xl flex items-center justify-center text-slate-200 hover:text-white transition shadow-lg" title="Zoom avant">
      <i class="fa-solid fa-plus text-xs"></i>
    </button>
    <button onclick="zoomMapOut()" class="glass-panel w-9 h-9 rounded-xl flex items-center justify-center text-slate-200 hover:text-white transition shadow-lg" title="Zoom arrière">
      <i class="fa-solid fa-minus text-xs"></i>
    </button>
  </div>

  <script>
    const travelSpots = [
      {
        id: "hurghada",
        name: "Hurghada (Mer Rouge)",
        region: "egypte",
        country: "Égypte",
        category: "plage",
        counts: { plage: 1 },
        lat: 27.2579,
        lng: 33.8116,
        image: "https://lh3.googleusercontent.com/pw/AP1GczPVx1_9UPwnhcWOyxckSpIvYC2T7xDRFTOGeQEiu82QKFht2G6YoXd-HB0DbIDdJ4ebV00ThDFY_RWXl7IznrNWOy4kUUJPV-vv__clD_rD2Ul_nUySiLRNNiubcIxwK81MgkkBsjwr0_BIkhfXFeTpgg=w1379-h919-s-no-gm?authuser=0",
        description: "Joyau de la côte égyptienne aux portes du désert arabique. Paradis de la plongée sous-marine réputé pour ses récifs coralliens.",
        link: "https://photos.app.goo.gl/WmQkwoGfa1tPnuex5"
      },
      {
        id: "charm_el_naga",
        name: "Charm el-Naga",
        region: "egypte",
        country: "Égypte",
        category: "plage",
        counts: { plage: 1 },
        lat: 27.0250,
        lng: 33.9150,
        image: "https://lh3.googleusercontent.com/pw/AP1GczM4ecV2oWKGbD_bDkpjOGJXygG-7vPAB5pg8vehhSGDjmXvbEsBLgl1mq_Ca4hyNgW-3MaQCcw2j7AVLMu_dkwwD0f5oNA7tnUo3u31wBKwpoPwjmYa9mBom71lHlNBurZ8mVXghWFoYTwWFwcmFEW1Hg=w1225-h919-s-no-gm?authuser=0",
        description: "Baie paradisiaque et sanctuaire naturel protégé sur la mer Rouge, célèbre pour son magnifique récif corallien.",
        link: "https://photos.google.com/share/AF1QipNRwK8ty9V3z_pZf-4EdBsAxQruzmu08jE2YUbNhN5qjAIvnZ-eD_YMF1h_I1jveg?key=Z19TSXNmSGNDazJoOEsxR3YyRmstR0R6aXExOWpR"
      }
    ];

    const CATEGORIES = {
      // CULTURE & PATRIMOINE
      musee: { label: "Musée", icon: "fa-landmark", color: "#a16207", section: "culture", active: true },
      religieux: { label: "Édifice religieux", icon: "fa-church", color: "#854d0e", section: "culture", active: true },
      chateau: { label: "Château / Palais", icon: "fa-chess-rook", color: "#713f12", section: "culture", active: true },
      archeologie: { label: "Site archéologique", icon: "fa-monument", color: "#78350f", section: "culture", active: true },
      unesco: { label: "Site UNESCO", icon: "fa-award", color: "#b45309", section: "culture", active: true },
      megalithe: { label: "Mégalithe", icon: "fa-archway", color: "#57534e", section: "culture", active: true },
      // NATURE & EAU
      cascade: { label: "Cascade", icon: "fa-water", color: "#0284c7", section: "nature", active: true },
      lac: { label: "Lac", icon: "fa-droplet", color: "#0ea5e9", section: "nature", active: true },
      plage: { label: "Plage / Plongée", icon: "fa-umbrella-beach", color: "#06b6d4", section: "nature", active: true },
      grotte: { label: "Grotte", icon: "fa-mountain", color: "#0369a1", section: "nature", active: true },
      volcan: { label: "Volcan", icon: "fa-volcano", color: "#dc2626", section: "nature", active: true },
      rando: { label: "Rando", icon: "fa-person-hiking", color: "#059669", section: "nature", active: true },
      parc_naturel: { label: "Parc naturel", icon: "fa-tree", color: "#16a34a", section: "nature", active: true }
    };

    let currentMode = 'globe';
    let myGlobe = null;
    let myLeafletMap = null;
    let leafletMarkersGroup = null;
    let activeTileLayerKey = 'satellite';
    let isAutoRotating = true;
    let currentSelectedSpot = null;
    let isZoomSwitching = false;
    let activeCursorCoords = { lat: 27.2579, lng: 33.8116 };

    function normalizeLongitude(lng) {
      return ((((lng + 180) % 360) + 360) % 360) - 180;
    }

    const TILE_LAYERS = {
      satellite: {
        name: "Satellite Esri HD",
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        attribution: '&copy; Esri, Maxar'
      },
      topo: {
        name: "Relief & Rando Topo",
        url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
        attribution: '&copy; OpenTopoMap'
      }
    };
    let currentTileLayerInstance = null;

    function checkContinuousGlobeZoom() {
      if (currentMode !== 'globe' || !myGlobe || isZoomSwitching) return;
      const pov = myGlobe.pointOfView();
      if (pov && pov.altitude <= 0.26) {
        isZoomSwitching = true;
        setViewingMode('map', activeCursorCoords, 9);
        setTimeout(() => { isZoomSwitching = false; }, 800);
      }
    }

    function initGlobe() {
      const container = document.getElementById('globe-container');
      if (!container || typeof Globe !== 'function') return;

      myGlobe = Globe()(container)
        .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg')
        .bumpImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png')
        .backgroundColor('rgba(2, 6, 23, 1)')
        .showAtmosphere(true)
        .atmosphereColor('#38bdf8')
        .atmosphereAltitude(0.18)
        .htmlElementsData([])
        .htmlLat(d => d.lat)
        .htmlLng(d => d.lng)
        .htmlAltitude(0.015)
        .htmlElement(d => {
          const anchor = document.createElement('div');
          anchor.className = 'globe-marker-anchor';

          if (d.isCluster) {
            anchor.innerHTML = `
              <div class="relative flex items-center justify-center pointer-events-auto">
                <span class="absolute w-8 h-8 rounded-full marker-radar pointer-events-none" style="background-color: #22d3ee;"></span>
                <div class="relative px-2 py-0.5 rounded-full flex items-center gap-1 text-white font-black text-[11px] bg-gradient-to-r from-cyan-600 to-blue-600 border border-white shadow-lg cursor-pointer transform hover:scale-125 transition">
                  <span>📍</span>
                  <span class="font-mono">${d.count}</span>
                </div>
              </div>
            `;
            anchor.onclick = (e) => {
              e.stopPropagation();
              myGlobe.pointOfView({ lat: d.lat, lng: d.lng, altitude: 0.35 }, 1000);
            };
            return anchor;
          }

          const cat = CATEGORIES[d.category] || { color: '#06b6d4', icon: 'fa-location-dot' };
          anchor.innerHTML = `
            <div class="relative flex items-center justify-center pointer-events-auto">
              <span class="absolute w-7 h-7 rounded-full marker-radar pointer-events-none" style="background-color: ${cat.color};"></span>
              <div class="relative w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] border-2 border-white/90 shadow-lg cursor-pointer transition hover:scale-125" style="background-color: ${cat.color}; box-shadow: 0 0 8px ${cat.color};">
                <i class="fa-solid ${cat.icon}"></i>
              </div>
            </div>
          `;
          anchor.onclick = (e) => {
            e.stopPropagation();
            selectSpot(d);
          };
          return anchor;
        });

      myGlobe.pointOfView({ lat: 27.2579, lng: 33.8116, altitude: 2.1 }, 0);

      const controls = myGlobe.controls();
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5;
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 105;
      controls.maxDistance = 550;

      controls.addEventListener('start', () => {
        if (isAutoRotating) {
          controls.autoRotate = false;
          isAutoRotating = false;
          updateAutoRotateIcon();
        }
      });

      container.addEventListener('pointermove', (e) => {
        const rect = container.getBoundingClientRect();
        if (typeof myGlobe.toGlobeCoords === 'function') {
          const coords = myGlobe.toGlobeCoords(e.clientX - rect.left, e.clientY - rect.top);
          if (coords && !isNaN(coords.lat)) {
            activeCursorCoords = { lat: coords.lat, lng: normalizeLongitude(coords.lng) };
          }
        }
      });

      controls.addEventListener('change', checkContinuousGlobeZoom);
      container.addEventListener('wheel', () => setTimeout(checkContinuousGlobeZoom, 50), { passive: true });

      container.addEventListener('dblclick', (e) => {
        e.preventDefault();
        setViewingMode('map', activeCursorCoords, 9);
      });

      updateGlobeDisplay();
    }

    function initLeafletMap(initialCenter = [27.2579, 33.8116], initialZoom = 10) {
      const container = document.getElementById('leaflet-container');
      if (!container || myLeafletMap) return;

      myLeafletMap = L.map('leaflet-container', {
        center: initialCenter,
        zoom: initialZoom,
        zoomControl: false,
        maxZoom: 18,
        minZoom: 3
      });

      currentTileLayerInstance = L.tileLayer(TILE_LAYERS.satellite.url, {
        attribution: TILE_LAYERS.satellite.attribution,
        maxZoom: 18
      }).addTo(myLeafletMap);

      if (typeof L.markerClusterGroup === 'function') {
        leafletMarkersGroup = L.markerClusterGroup({
          spiderfyOnMaxZoom: true,
          showCoverageOnHover: false,
          zoomToBoundsOnClick: true,
          maxClusterRadius: 40,
          iconCreateFunction: function(cluster) {
            return L.divIcon({
              html: `<span>${cluster.getChildCount()}</span>`,
              className: 'custom-cluster-icon',
              iconSize: L.point(32, 32)
            });
          }
        });
      } else {
        leafletMarkersGroup = L.featureGroup();
      }

      myLeafletMap.addLayer(leafletMarkersGroup);

      myLeafletMap.on('zoomend', () => {
        if (currentMode === 'map' && myLeafletMap.getZoom() <= 4 && !isZoomSwitching) {
          isZoomSwitching = true;
          const center = myLeafletMap.getCenter();
          setViewingMode('globe', { lat: center.lat, lng: center.lng, altitude: 2.1 });
          setTimeout(() => { isZoomSwitching = false; }, 800);
        }
      });

      updateLeafletDisplay();
    }

    function updateLeafletDisplay() {
      if (!myLeafletMap || !leafletMarkersGroup) return;
      leafletMarkersGroup.clearLayers();

      getFilteredSpots().forEach(spot => {
        const cat = CATEGORIES[spot.category] || { color: '#06b6d4', icon: 'fa-location-dot' };
        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="background-color: ${cat.color}; box-shadow: 0 0 8px ${cat.color};" class="w-7 h-7 rounded-full flex items-center justify-center text-white border-2 border-white shadow-lg cursor-pointer transform hover:scale-125 transition"><i class="fa-solid ${cat.icon} text-[11px]"></i></div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });
        const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });
        marker.on('click', () => selectSpot(spot));
        leafletMarkersGroup.addLayer(marker);
      });
    }

    function setViewingMode(mode, targetCoords = null, targetZoom = null) {
      currentMode = mode;
      const globeView = document.getElementById('globe-view');
      const mapView = document.getElementById('map-view');
      const btnGlobe = document.getElementById('btn-mode-globe');
      const btnMap = document.getElementById('btn-mode-map');
      const headerIcon = document.getElementById('header-mode-icon');
      const subtitle = document.getElementById('header-subtitle');
      const btnTiles = document.getElementById('btn-toggle-tiles');
      const btnRotate = document.getElementById('btn-toggle-rotate');

      if (mode === 'map') {
        let lat = targetCoords ? targetCoords.lat : activeCursorCoords.lat;
        let lng = targetCoords ? normalizeLongitude(targetCoords.lng) : activeCursorCoords.lng;
        let zoom = targetZoom || 10;

        globeView.classList.replace('opacity-100', 'opacity-0');
        globeView.classList.replace('pointer-events-auto', 'pointer-events-none');
        mapView.classList.replace('opacity-0', 'opacity-100');
        mapView.classList.replace('pointer-events-none', 'pointer-events-auto');

        btnMap.classList.add('bg-cyan-500', 'text-white', 'shadow');
        btnMap.classList.remove('text-slate-300');
        btnGlobe.classList.remove('bg-cyan-500', 'text-white', 'shadow');
        btnGlobe.classList.add('text-slate-300');

        headerIcon.className = "fa-solid fa-map-location-dot text-xs text-cyan-300";
        subtitle.innerText = "Zoom Haute Précision (2D)";
        btnTiles.classList.remove('hidden');
        btnRotate.classList.add('hidden');

        if (!myLeafletMap) {
          initLeafletMap([lat, lng], zoom);
        } else {
          myLeafletMap.invalidateSize();
          myLeafletMap.setView([lat, lng], zoom, { animate: false });
        }
      } else {
        let lat = targetCoords ? targetCoords.lat : 27.2579;
        let lng = targetCoords ? normalizeLongitude(targetCoords.lng) : 33.8116;
        let altitude = targetCoords && targetCoords.altitude ? targetCoords.altitude : 2.1;

        mapView.classList.replace('opacity-100', 'opacity-0');
        mapView.classList.replace('pointer-events-auto', 'pointer-events-none');
        globeView.classList.replace('opacity-0', 'opacity-100');
        globeView.classList.replace('pointer-events-none', 'pointer-events-auto');

        btnGlobe.classList.add('bg-cyan-500', 'text-white', 'shadow');
        btnGlobe.classList.remove('text-slate-300');
        btnMap.classList.remove('bg-cyan-500', 'text-white', 'shadow');
        btnMap.classList.add('text-slate-300');

        headerIcon.className = "fa-solid fa-earth-africa text-xs";
        subtitle.innerText = "Vue planétaire 3D";
        btnTiles.classList.add('hidden');
        btnRotate.classList.remove('hidden');

        if (myGlobe) {
          setTimeout(onWindowResize, 100);
          myGlobe.pointOfView({ lat: lat, lng: lng, altitude: altitude }, 1000);
        }
      }
      updateSpotToggleButton();
    }

    function selectSpot(spot) {
      currentSelectedSpot = spot;
      const card = document.getElementById('destination-card');
      const img = document.getElementById('card-img');
      const badge = document.getElementById('card-badge');
      const title = document.getElementById('card-title');
      const location = document.getElementById('card-location');
      const desc = document.getElementById('card-description');
      const link = document.getElementById('card-link');

      const cat = CATEGORIES[spot.category] || { label: 'Étape', color: '#06b6d4', icon: 'fa-map-pin' };
      img.src = spot.image;
      badge.style.backgroundColor = cat.color;
      badge.innerHTML = `<i class="fa-solid ${cat.icon} mr-1"></i> ${cat.label}`;
      title.innerText = spot.name;
      location.querySelector('span').innerText = `${spot.country} · ${spot.lat.toFixed(4)}°N, ${spot.lng.toFixed(4)}°E`;
      desc.innerText = spot.description;
      link.href = spot.link;

      updateSpotToggleButton();
      card.classList.remove('hidden');

      if (currentMode === 'globe' && myGlobe) {
        myGlobe.pointOfView({ lat: spot.lat, lng: spot.lng, altitude: 0.35 }, 1000);
      } else if (currentMode === 'map' && myLeafletMap) {
        myLeafletMap.flyTo([spot.lat, spot.lng], 13, { duration: 1.0 });
      }
    }

    function closeSpotCard() {
      currentSelectedSpot = null;
      document.getElementById('destination-card').classList.add('hidden');
    }

    function toggleCurrentSpotViewMode() {
      if (currentMode === 'globe') {
        if (currentSelectedSpot) {
          setViewingMode('map', { lat: currentSelectedSpot.lat, lng: currentSelectedSpot.lng }, 13);
        } else {
          setViewingMode('map');
        }
      } else {
        setViewingMode('globe', { lat: 27.2579, lng: 33.8116, altitude: 2.1 });
      }
    }

    function updateSpotToggleButton() {
      const btnIcon = document.getElementById('card-btn-icon');
      const btnLabel = document.getElementById('card-btn-label');
      if (!btnIcon || !btnLabel) return;
      if (currentMode === 'globe') {
        btnIcon.className = "fa-solid fa-map-location-dot text-cyan-400 text-[10px]";
        btnLabel.innerText = "Explorer en 2D";
      } else {
        btnIcon.className = "fa-solid fa-globe text-cyan-400 text-[10px]";
        btnLabel.innerText = "Observer en 3D (Globe)";
      }
    }

    function flyToSpotCoordinates(lat, lng, zoom2D = 12) {
      if (currentMode === 'map') {
        if (myLeafletMap) myLeafletMap.flyTo([lat, lng], zoom2D, { duration: 1.2 });
      } else {
        if (myGlobe) myGlobe.pointOfView({ lat: lat, lng: lng, altitude: 0.35 }, 1200);
      }
    }

    function resetGlobalView() {
      closeSpotCard();
      setViewingMode('globe', { lat: 27.2579, lng: 33.8116, altitude: 2.1 });
    }

    function getFilteredSpots() {
      return travelSpots.filter(spot => {
        const cat = CATEGORIES[spot.category];
        return cat ? cat.active : true;
      });
    }

    function updateGlobeDisplay() {
      if (!myGlobe) return;
      
      const spots = getFilteredSpots();
      const clusterMap = new Map();
      const finalElements = [];

      spots.forEach(spot => {
        const key = `${Math.round(spot.lat * 20)}_${Math.round(spot.lng * 20)}`;
        if (!clusterMap.has(key)) {
          clusterMap.set(key, []);
        }
        clusterMap.get(key).push(spot);
      });

      clusterMap.forEach((group) => {
        if (group.length > 1) {
          let avgLat = group.reduce((sum, s) => sum + s.lat, 0) / group.length;
          let avgLng = group.reduce((sum, s) => sum + s.lng, 0) / group.length;
          finalElements.push({
            isCluster: true,
            lat: avgLat,
            lng: avgLng,
            count: group.length,
            spots: group
          });
        } else {
          finalElements.push(group[0]);
        }
      });

      myGlobe.htmlElementsData(finalElements);
      updateStats();
    }

    function renderCategoryToggles() {
      const container = document.getElementById('category-toggles');
      if (!container) return;
      container.innerHTML = '';

      let lastSection = null;

      Object.keys(CATEGORIES).forEach(key => {
        const cat = CATEGORIES[key];

        if (cat.section !== lastSection) {
          lastSection = cat.section;
          if (container.children.length > 0) {
            const sep = document.createElement('div');
            sep.className = 'w-full h-[1px] bg-slate-700/60 my-2';
            container.appendChild(sep);
          }
          const sectionHeader = document.createElement('div');
          sectionHeader.className = 'pb-1 text-[10px] font-bold uppercase tracking-wider flex items-center gap-1.5';
          if (lastSection === 'culture') {
            sectionHeader.className += ' text-amber-500';
            sectionHeader.innerHTML = '<i class="fa-solid fa-landmark"></i> Culture & Patrimoine';
          } else {
            sectionHeader.className += ' text-cyan-400';
            sectionHeader.innerHTML = '<i class="fa-solid fa-water"></i> Nature & Eau';
          }
          container.appendChild(sectionHeader);
        }

        const row = document.createElement('label');
        row.className = 'flex items-center justify-between p-1.5 rounded-xl bg-slate-900/60 hover:bg-slate-800/80 cursor-pointer transition select-none border border-slate-800/60';
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <input type="checkbox" ${cat.active ? 'checked' : ''} onchange="toggleCategory('${key}')" class="w-3.5 h-3.5 rounded text-cyan-500 bg-slate-800 border-slate-700 focus:ring-0 cursor-pointer">
            <span class="w-2 h-2 rounded-full" style="background-color: ${cat.color}"></span>
            <span class="text-slate-200 text-[11px] font-medium truncate">${cat.label}</span>
          </div>
          <i class="fa-solid ${cat.icon} text-slate-400 text-[10px]"></i>
        `;
        container.appendChild(row);
      });
    }

    function toggleCategory(key) {
      if (CATEGORIES[key]) {
        CATEGORIES[key].active = !CATEGORIES[key].active;
        updateGlobeDisplay();
        updateLeafletDisplay();
      }
    }

    function setAllFilters(state) {
      Object.keys(CATEGORIES).forEach(k => {
        CATEGORIES[k].active = state;
      });
      renderCategoryToggles();
      updateGlobeDisplay();
      updateLeafletDisplay();
    }

    function updateStats() {
      let totalSites = travelSpots.length;
      const totalEl = document.getElementById('stat-total');
      if (totalEl) totalEl.innerText = totalSites;

      const narrowContainer = document.getElementById('narrow-hud-list');
      if (!narrowContainer) return;
      narrowContainer.innerHTML = '';

      let lastSection = null;

      Object.keys(CATEGORIES).forEach(key => {
        const cat = CATEGORIES[key];

        if (cat.section !== lastSection) {
          lastSection = cat.section;
          if (narrowContainer.children.length > 0) {
            const sep = document.createElement('div');
            sep.className = 'w-8 h-[1px] bg-slate-700/60 my-1.5';
            narrowContainer.appendChild(sep);
          }
        }

        let count = 0;
        travelSpots.forEach(s => {
          if (s.counts && typeof s.counts[key] === 'number') {
            count += s.counts[key];
          } else if (s.category === key) {
            count += 1;
          }
        });

        const item = document.createElement('div');
        item.className = 'flex items-center justify-between w-full px-1 py-1 rounded-lg bg-slate-900/70 border border-slate-800/70';
        item.title = `${cat.label} : ${count}`;
        item.innerHTML = `
          <div class="w-5 h-5 rounded-md flex items-center justify-center text-[10px]" style="background-color: ${cat.color}25; color: ${cat.color}">
            <i class="fa-solid ${cat.icon}"></i>
          </div>
          <span class="font-mono font-bold text-[11px] ${count > 0 ? 'text-white' : 'text-slate-500'}">${count}</span>
        `;
        narrowContainer.appendChild(item);
      });
    }

    function zoomMapIn() {
      if (currentMode === 'map' && myLeafletMap) {
        myLeafletMap.zoomIn();
      } else if (myGlobe) {
        const pov = myGlobe.pointOfView();
        const nextAlt = pov.altitude - 0.35;
        if (nextAlt <= 0.28) {
          setViewingMode('map', activeCursorCoords, 9);
        } else {
          myGlobe.pointOfView({ altitude: nextAlt }, 350);
        }
      }
    }

    function zoomMapOut() {
      if (currentMode === 'map' && myLeafletMap) {
        if (myLeafletMap.getZoom() <= 4) {
          const center = myLeafletMap.getCenter();
          setViewingMode('globe', { lat: center.lat, lng: center.lng, altitude: 2.1 });
        } else {
          myLeafletMap.zoomOut();
        }
      } else if (myGlobe) {
        const pov = myGlobe.pointOfView();
        myGlobe.pointOfView({ altitude: Math.min(3.5, pov.altitude + 0.35) }, 350);
      }
    }

    function toggleMapTileLayer() {
      if (!myLeafletMap || !currentTileLayerInstance) return;
      myLeafletMap.removeLayer(currentTileLayerInstance);
      if (activeTileLayerKey === 'satellite') {
        activeTileLayerKey = 'topo';
        currentTileLayerInstance = L.tileLayer(TILE_LAYERS.topo.url, { maxZoom: 17 }).addTo(myLeafletMap);
      } else {
        activeTileLayerKey = 'satellite';
        currentTileLayerInstance = L.tileLayer(TILE_LAYERS.satellite.url, { maxZoom: 18 }).addTo(myLeafletMap);
      }
    }

    function toggleGlobeAutoRotate() {
      if (!myGlobe) return;
      isAutoRotating = !isAutoRotating;
      myGlobe.controls().autoRotate = isAutoRotating;
      updateAutoRotateIcon();
    }

    function updateAutoRotateIcon() {
      const icon = document.getElementById('icon-auto-rotate');
      if (icon) icon.className = isAutoRotating ? "fa-solid fa-pause text-xs" : "fa-solid fa-play text-xs";
    }

    function onWindowResize() {
      const container = document.getElementById('globe-container');
      if (myGlobe && container) {
        myGlobe.width(container.clientWidth);
        myGlobe.height(container.clientHeight);
      }
      if (myLeafletMap) myLeafletMap.invalidateSize();
    }

    window.addEventListener('resize', onWindowResize);
    window.onload = function () {
      initGlobe();
      renderCategoryToggles();
      updateStats();
      setTimeout(onWindowResize, 200);
    };
  </script>
</body>
</html>

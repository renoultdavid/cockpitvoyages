<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cockpit Voyage - Globe 3D & Carte Rando HD</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/1.5.3/leaflet.markercluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.7);
    }

    .globe-marker-anchor {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      width: 0;
      height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes radar-pulse-dynamic {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(var(--pulse-scale, 2.8)); opacity: 0; }
    }
    .marker-radar-dynamic {
      animation: radar-pulse-dynamic var(--pulse-speed, 2s) cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes counter-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(34, 211, 238, 0); }
      50% { transform: scale(1.03); box-shadow: 0 0 12px rgba(34, 211, 238, 0.4); }
    }
    .counter-pulse-anim {
      animation: counter-pulse 2.8s ease-in-out infinite;
    }

    @keyframes counter-pulse-amber {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(245, 158, 11, 0); }
      50% { transform: scale(1.03); box-shadow: 0 0 12px rgba(245, 158, 11, 0.4); }
    }
    .counter-pulse-amber-anim {
      animation: counter-pulse-amber 3.2s ease-in-out infinite;
    }

    .custom-cluster-icon {
      background: rgba(14, 116, 144, 0.95);
      border: 2px solid #22d3ee;
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(34, 211, 238, 0.6);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .panel-transition {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, width 0.3s ease;
    }
  </style>
</head>
<body class="relative w-full h-full bg-slate-950 font-sans antialiased text-slate-100 overflow-hidden">

  <div id="globe-view" class="absolute inset-0 w-full h-full z-0 transition-opacity duration-500 opacity-100 pointer-events-auto">
    <div id="globe-container" class="w-full h-full"></div>
    <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
      <div id="aim-reticle" class="relative w-10 h-10 rounded-full border border-cyan-400/25 flex items-center justify-center opacity-30">
        <div class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]"></div>
      </div>
    </div>
  </div>

  <div id="map-view" class="absolute inset-0 w-full h-full z-0 transition-opacity duration-500 opacity-0 pointer-events-none bg-slate-950">
    <div id="leaflet-container" class="w-full h-full"></div>
  </div>

  <header class="absolute top-3 left-3 right-3 z-30 flex items-center justify-between pointer-events-none">
    <div class="flex items-center gap-2 pointer-events-auto">
      <div class="glass-panel px-3 py-2 rounded-2xl flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/25 text-white">
          <i id="header-mode-icon" class="fa-solid fa-earth-africa text-xs"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
            Cockpit Voyage <span class="text-cyan-400 font-mono text-[10px] px-1.5 py-0.5 rounded bg-cyan-950/80 border border-cyan-500/30">HD</span>
          </h1>
          <p id="header-subtitle" class="text-[10px] text-slate-400">Vue planétaire 3D</p>
        </div>
      </div>

      <!-- Bascule Globe 3D / Carte HD -->
      <div class="glass-panel p-1 rounded-2xl flex items-center shadow-lg">
        <button id="btn-mode-globe" onclick="setViewingMode('globe')" class="px-3 py-1 rounded-xl text-xs font-semibold transition-all duration-200 bg-cyan-500 text-white shadow">
          <i class="fa-solid fa-globe mr-1"></i> 3D
        </button>
        <button id="btn-mode-map" onclick="triggerManualMapSwitch()" class="px-3 py-1 rounded-xl text-xs font-semibold transition-all duration-200 text-slate-300 hover:text-white">
          <i class="fa-solid fa-map mr-1"></i> Carte HD
        </button>
      </div>
    </div>

    <!-- COMPTEURS HAUT CENTRE (SITES & PAYS VISITÉS) AVEC PULSATION DISCRÈTE -->
    <div class="flex items-center gap-2 pointer-events-auto">
      <div class="glass-panel px-3 py-1.5 rounded-2xl flex items-center gap-2 counter-pulse-anim border-cyan-500/40">
        <div class="w-6 h-6 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xs">
          <i class="fa-solid fa-map-pin"></i>
        </div>
        <div>
          <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Sites visités</div>
          <div id="header-stat-sites" class="text-xs font-black text-cyan-300 font-mono">5</div>
        </div>
      </div>
      <div class="glass-panel px-3 py-1.5 rounded-2xl flex items-center gap-2 counter-pulse-amber-anim border-amber-500/40">
        <div class="w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs">
          <i class="fa-solid fa-globe"></i>
        </div>
        <div>
          <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Pays visités</div>
          <div id="header-stat-countries" class="text-xs font-black text-amber-300 font-mono">1</div>
        </div>
      </div>
    </div>

    <!-- Saut Rapide -->
    <div class="hidden lg:flex items-center gap-1.5 pointer-events-auto glass-panel px-2.5 py-1.5 rounded-2xl">
      <button onclick="flyToSpotCoordinates(27.2579, 33.8116, 12)" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-cyan-500/25 hover:bg-cyan-500/35 text-cyan-300 border border-cyan-500/40 transition flex items-center gap-1">
        <span>🐠</span> Hurghada
      </button>
      <button onclick="flyToSpotCoordinates(22.3372, 31.6258, 11)" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-amber-500/25 hover:bg-amber-500/35 text-amber-300 border border-amber-500/40 transition flex items-center gap-1">
        <span>🏛️</span> Abou Simbel
      </button>
      <button onclick="flyToSpotCoordinates(24.0255, 32.8842, 12)" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-amber-600/25 hover:bg-amber-600/35 text-amber-200 border border-amber-500/40 transition flex items-center gap-1">
        <span>⛩️</span> Philae
      </button>
      <button onclick="resetGlobalView()" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center gap-1" title="Vue globale planète 3D">
        <i class="fa-solid fa-globe"></i> Globe
      </button>
    </div>
  </header>

  <aside id="left-dock" class="absolute top-16 left-3 z-30 flex items-start pointer-events-auto">
    <div class="flex items-start">
      <div id="filters-panel" class="glass-panel rounded-2xl p-3 shadow-2xl w-64 sm:w-72 overflow-y-auto no-scrollbar panel-transition relative">
        <!-- Ligne unique d'en-tête de filtre sur toute la largeur -->
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-700/60">
          <div class="flex items-center gap-1.5">
            <i class="fa-solid fa-filter text-cyan-400 text-xs"></i>
            <h2 class="text-xs font-bold tracking-wide uppercase text-slate-200">Filtres</h2>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="setAllFilters(true)" class="text-[10px] text-cyan-400 hover:text-cyan-300 font-semibold underline">Tout</button>
            <span class="text-slate-600 text-[10px]">·</span>
            <button onclick="setAllFilters(false)" class="text-[10px] text-slate-400 hover:text-rose-400 font-semibold underline">Aucun</button>
            <button onclick="toggleFiltersPanel()" class="ml-1 text-slate-400 hover:text-white text-xs" title="Replier les filtres"><i class="fa-solid fa-chevron-left"></i></button>
          </div>
        </div>
        <!-- Liste unifiée : chaque ligne combine l'icône, le nom et le compteur -->
        <div id="unified-category-list" class="space-y-1 text-xs"></div>
      </div>

      <!-- BOUTON DE DÉPLOIEMENT QUAND LE PANNEAU EST FERMÉ -->
      <button id="btn-open-filters" onclick="toggleFiltersPanel()" class="glass-panel hidden px-2 py-3 rounded-xl text-cyan-400 hover:text-white text-xs shadow-2xl flex items-center justify-center ml-1" title="Ouvrir les filtres">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </aside>

  <section id="destination-card" class="absolute top-16 right-3 z-40 glass-panel rounded-2xl p-4 shadow-2xl border-cyan-500/40 hidden pointer-events-auto transition-all duration-300 w-[440px] sm:w-[540px] flex flex-col justify-between max-h-[calc(100vh-5rem)] overflow-y-auto no-scrollbar">
    <div class="relative flex flex-col gap-3">
      <button onclick="closeSpotCard()" class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-slate-900/90 hover:bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-xs transition z-10 border border-slate-700">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- EN-TÊTE PAYS & RÉGION / ÉTAT -->
      <div id="card-geo-header" class="flex items-center gap-2 px-2.5 py-1.5 rounded-xl bg-slate-900/80 border border-slate-800/80 text-xs font-medium text-slate-300">
        <span id="card-flag" class="text-base"></span>
        <span id="card-country-region" class="truncate font-semibold text-white"></span>
      </div>

      <!-- IMAGE PROPRE -->
      <div class="w-full h-48 rounded-xl overflow-hidden bg-slate-900 shrink-0 relative border border-slate-700/50">
        <img id="card-img" src="" alt="Aperçu destination" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x200/0f172a/38bdf8?text=Voyage'">
      </div>

      <!-- ESPACE DÉDIÉ SOUS L'IMAGE POUR LES ÉTIQUETTES -->
      <div id="card-photo-tags" class="flex flex-wrap items-center gap-1.5 min-h-[26px]"></div>

      <!-- TITRE & COORDONNÉES -->
      <div class="flex flex-col gap-0.5">
        <h3 id="card-title" class="text-sm font-bold text-white pr-4"></h3>
        <p id="card-location" class="text-[10px] text-cyan-400 font-medium flex items-center gap-1">
          <i class="fa-solid fa-location-dot"></i> <span></span>
        </p>
      </div>

      <!-- SECTION 1 : INTRODUCTION (6-7 LIGNES) -->
      <div class="flex flex-col gap-1 bg-slate-900/60 p-3 rounded-xl border border-slate-800/80">
        <div class="text-[10px] font-bold uppercase tracking-wider text-cyan-400 flex items-center gap-1">
          <i class="fa-solid fa-book-open"></i> Introduction
        </div>
        <p id="card-description" class="text-[11px] text-slate-300 leading-relaxed line-clamp-[7] h-[115px] overflow-y-auto no-scrollbar pr-1"></p>
      </div>

      <!-- SECTION 2 : À VISITER / INCONTOURNABLES (6-7 LIGNES) -->
      <div class="flex flex-col gap-1 bg-slate-900/60 p-3 rounded-xl border border-slate-800/80">
        <div class="text-[10px] font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1">
          <i class="fa-solid fa-compass"></i> À visiter & Incontournables
        </div>
        <p id="card-visiter" class="text-[11px] text-slate-300 leading-relaxed line-clamp-[7] h-[115px] overflow-y-auto no-scrollbar pr-1"></p>
      </div>
    </div>

    <!-- BOUTONS D'ACTION -->
    <div class="flex flex-col gap-2 pt-3 border-t border-slate-700/60 mt-3">
      <a id="card-link" href="#" target="_blank" rel="noopener noreferrer" class="w-full py-2 px-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-[11px] font-semibold flex items-center justify-center gap-1.5 shadow-md shadow-cyan-500/20 transition">
        <i class="fa-solid fa-images text-[10px]"></i>
        <span>Voir l'album photo</span>
        <i class="fa-solid fa-arrow-up-right-from-square text-[9px] opacity-75"></i>
      </a>
      <button id="card-btn-mode-toggle" onclick="toggleCurrentSpotViewMode()" class="w-full py-2 px-3 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 text-[11px] font-medium flex items-center justify-center gap-1.5 border border-slate-700 transition">
        <i id="card-btn-icon" class="fa-solid fa-map-location-dot text-cyan-400 text-[10px]"></i>
        <span id="card-btn-label">Explorer en 2D</span>
      </button>
    </div>
  </section>

  <div class="absolute bottom-4 left-3 z-30 flex flex-col gap-1.5 pointer-events-auto">
    <button id="btn-toggle-tiles" onclick="toggleMapTileLayer()" class="glass-panel w-9 h-9 rounded-xl flex items-center justify-center text-cyan-300 hover:text-white transition shadow-lg hidden" title="Basculer Satellite / Topo">
      <i class="fa-solid fa-layer-group text-xs"></i>
    </button>
    <button id="btn-toggle-rotate" onclick="toggleGlobeAutoRotate()" class="glass-panel w-9 h-9 rounded-xl flex items-center justify-center text-cyan-300 hover:text-white transition shadow-lg" title="Activer / Arrêter la rotation">
      <i id="icon-auto-rotate" class="fa-solid fa-pause text-xs"></i>
    </button>
    <button onclick="zoomMapIn()" class="glass-panel w-9 h-9 rounded-xl flex items-center justify-center text-slate-200 hover:text-white transition shadow-lg" title="Zoom avant">
      <i class="fa-solid fa-plus text-xs"></i>
    </button>
    <button onclick="zoomMapOut()" class="glass-panel w-9 h-9 rounded-xl flex items-center justify-center text-slate-200 hover:text-white transition shadow-lg" title="Zoom arrière">
      <i class="fa-solid fa-minus text-xs"></i>
    </button>
  </div>

    let currentMode = 'globe';

    let myLeafletMap = null;
    let leafletMarkersGroup = null;

    let currentSelectedSpot = null;
    let isTransitioningMode = false;

    function toggleFiltersPanel() {
      isFiltersPanelOpen = !isFiltersPanelOpen;
      const panel = document.getElementById('filters-panel');
      const btnOpen = document.getElementById('btn-open-filters');
      if (panel && btnOpen) {
        if (isFiltersPanelOpen) {
          panel.style.transform = 'translateX(0)';

        }
      }

    function normalizeLongitude(lng) {
      return ((((lng + 180) % 360) + 360) % 360) - 180;
    }

    function getExactGlobeCenterCoords() {
      if (!myGlobe) return { lat: 27.2579, lng: 33.8116 };
      if (currentSelectedSpot) {
        return { lat: currentSelectedSpot.lat, lng: currentSelectedSpot.lng };
      }
      const container = document.getElementById('globe-container');
      const width = container ? container.clientWidth : window.innerWidth;
      const height = container ? container.clientHeight : window.innerHeight;
      if (typeof myGlobe.toGlobeCoords === 'function') {
        const centerCoords = myGlobe.toGlobeCoords(width / 2, height / 2);
        if (centerCoords && !isNaN(centerCoords.lat) && !isNaN(centerCoords.lng)) {
          return { lat: Math.max(-85, Math.min(85, centerCoords.lat)), lng: normalizeLongitude(centerCoords.lng) };
        }
      }
      const pov = myGlobe.pointOfView();
      return { lat: Math.max(-85, Math.min(85, pov.lat || 0)), lng: normalizeLongitude(pov.lng || 0) };
    }

    const TILE_LAYERS = {
      satellite: {
        name: "Satellite Esri HD",
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        attribution: '&copy; Esri, Maxar'
      },
      topo: {
        name: "Relief & Rando Topo",
        url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
        attribution: '&copy; OpenTopoMap'
      }
    };
    let currentTileLayerInstance = null;

    function checkContinuousGlobeZoom() {
      if (currentMode !== 'globe' || !myGlobe || isTransitioningMode) return;
      const pov = myGlobe.pointOfView();
      if (pov && pov.altitude <= 0.26) {
        isTransitioningMode = true;
        const target = activeCursorCoords || getExactGlobeCenterCoords();
        setViewingMode('map', target, 9);
        setTimeout(() => { isTransitioningMode = false; }, 1000);
      }
    }

    function initGlobe() {
      const container = document.getElementById('globe-container');
      if (!container || typeof Globe !== 'function') return;

      myGlobe = Globe()(container)
        .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg')
        .bumpImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png')
        .backgroundColor('rgba(2, 6, 23, 1)')
        .showAtmosphere(true)
        .atmosphereColor('#38bdf8')
        .atmosphereAltitude(0.18)
        .htmlElementsData([])
        .htmlLat(d => d.lat)
        .htmlLng(d => d.lng)
        .htmlAltitude(0.015)
        .htmlElement(d => {
          const anchor = document.createElement('div');
          anchor.className = 'globe-marker-anchor';

          if (d.isCluster) {
            const count = d.count;
            const pulseScale = count > 1 ? Math.min(4.5, 1.3 + (count * 0.4)) : 1;
            const pulseSpeed = Math.max(0.3, 1.8 - (count * 0.2));
            const radarClass = count > 1 ? 'marker-radar-dynamic' : '';

            anchor.innerHTML = `
              <div class="relative flex items-center justify-center pointer-events-auto">
                <span class="absolute w-12 h-12 rounded-full ${radarClass} pointer-events-none" style="background-color: #22d3ee; --pulse-scale: ${pulseScale}; --pulse-speed: ${pulseSpeed}s;"></span>
                <div class="relative px-3.5 py-1.5 rounded-full flex items-center gap-1.5 text-white font-black text-xs bg-gradient-to-r from-cyan-600 to-blue-600 border-2 border-white shadow-xl cursor-pointer transform hover:scale-125 transition">
                  <span>📍</span>
                  <span class="font-mono text-sm">${count}</span>
                </div>
              </div>
            `;
            anchor.onclick = (e) => {
              e.stopPropagation();
              myGlobe.pointOfView({ lat: d.lat, lng: d.lng, altitude: 0.35 }, 1000);
            };
            return anchor;
          }

          const spot = d.spot;
          const activeCatKey = getFirstActiveCategoryForSpot(spot);
          const cat = CATEGORIES[activeCatKey] || CATEGORIES[spot.category] || { color: '#06b6d4', icon: 'fa-location-dot' };

          anchor.innerHTML = `
            <div class="relative flex items-center justify-center pointer-events-auto">
              <div class="relative w-7 h-7 rounded-full flex items-center justify-center text-white text-[11px] border-2 border-white/90 shadow-lg cursor-pointer transition hover:scale-125" style="background-color: ${cat.color}; box-shadow: 0 0 10px ${cat.color};">
                <i class="fa-solid ${cat.icon}"></i>
              </div>
            </div>
          `;
          anchor.onclick = (e) => {
            e.stopPropagation();
            selectSpot(spot);
          };
          return anchor;
        });

      myGlobe.pointOfView({ lat: 27.2579, lng: 33.8116, altitude: 2.1 }, 0);

      const controls = myGlobe.controls();
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5;
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 105;
      controls.maxDistance = 550;

      controls.addEventListener('start', () => {
        if (isAutoRotating) {
          controls.autoRotate = false;
          isAutoRotating = false;
          updateAutoRotateIcon();
        }
      });

      container.addEventListener('pointermove', (e) => {
        const rect = container.getBoundingClientRect();
        if (typeof myGlobe.toGlobeCoords === 'function') {
          const coords = myGlobe.toGlobeCoords(e.clientX - rect.left, e.clientY - rect.top);
          if (coords && !isNaN(coords.lat)) {
            activeCursorCoords = { lat: coords.lat, lng: normalizeLongitude(coords.lng) };
          }
        }
      });

      controls.addEventListener('change', checkContinuousGlobeZoom);
      container.addEventListener('wheel', () => setTimeout(checkContinuousGlobeZoom, 50), { passive: true });

      updateGlobeDisplay();
    }

    function initLeafletMap(initialCenter = [27.2579, 33.8116], initialZoom = 10) {
      const container = document.getElementById('leaflet-container');
      if (!container || myLeafletMap) return;

      myLeafletMap = L.map('leaflet-container', {
        center: initialCenter,
        zoom: initialZoom,
        zoomControl: false,
        maxZoom: 18,
        minZoom: 3
      });

      currentTileLayerInstance = L.tileLayer(TILE_LAYERS.satellite.url, {
        attribution: TILE_LAYERS.satellite.attribution,
        maxZoom: 18
      }).addTo(myLeafletMap);

      if (typeof L.markerClusterGroup === 'function') {
        leafletMarkersGroup = L.markerClusterGroup({
          spiderfyOnMaxZoom: true,
          showCoverageOnHover: false,
          zoomToBoundsOnClick: true,
          maxClusterRadius: 40,
          iconCreateFunction: function(cluster) {
            return L.divIcon({
              html: `<span>${cluster.getChildCount()}</span>`,
              className: 'custom-cluster-icon',
              iconSize: L.point(32, 32)
            });
          }
        });
      } else {
        leafletMarkersGroup = L.featureGroup();
      }

      myLeafletMap.addLayer(leafletMarkersGroup);

      myLeafletMap.on('zoomend', () => {
        if (currentMode === 'map' && myLeafletMap.getZoom() <= 4 && !isTransitioningMode) {
          isTransitioningMode = true;
          const center = myLeafletMap.getCenter();
          setViewingMode('globe', { lat: center.lat, lng: center.lng, altitude: 2.1 });
          setTimeout(() => { isTransitioningMode = false; }, 1000);
        }
      });

      updateLeafletDisplay();
    }

    function updateLeafletDisplay() {
      if (!myLeafletMap || !leafletMarkersGroup) return;
      leafletMarkersGroup.clearLayers();

      getFilteredSpots().forEach(spot => {
        const activeCatKey = getFirstActiveCategoryForSpot(spot);
        const cat = CATEGORIES[activeCatKey] || CATEGORIES[spot.category] || { color: '#06b6d4', icon: 'fa-location-dot' };
        
        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="background-color: ${cat.color}; box-shadow: 0 0 8px ${cat.color};" class="w-7 h-7 rounded-full flex items-center justify-center text-white border-2 border-white shadow-lg cursor-pointer transform hover:scale-125 transition"><i class="fa-solid ${cat.icon} text-[11px]"></i></div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });
        const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });
        marker.on('click', () => selectSpot(spot));
        leafletMarkersGroup.addLayer(marker);
      });
    }

    function setViewingMode(mode, targetCoords = null, targetZoom = null) {
      currentMode = mode;
      const globeView = document.getElementById('globe-view');
      const mapView = document.getElementById('map-view');
      const btnGlobe = document.getElementById('btn-mode-globe');
      const btnMap = document.getElementById('btn-mode-map');
      const headerIcon = document.getElementById('header-mode-icon');
      const subtitle = document.getElementById('header-subtitle');
      const btnTiles = document.getElementById('btn-toggle-tiles');
      const btnRotate = document.getElementById('btn-toggle-rotate');

      if (mode === 'map') {
        let lat = targetCoords ? targetCoords.lat : (activeCursorCoords ? activeCursorCoords.lat : 27.2579);
        let lng = targetCoords ? normalizeLongitude(targetCoords.lng) : (activeCursorCoords ? activeCursorCoords.lng : 33.8116);
        let zoom = targetZoom || 9;

        globeView.classList.replace('opacity-100', 'opacity-0');
        globeView.classList.replace('pointer-events-auto', 'pointer-events-none');
        mapView.classList.replace('opacity-0', 'opacity-100');
        mapView.classList.replace('pointer-events-none', 'pointer-events-auto');

        btnMap.classList.add('bg-cyan-500', 'text-white', 'shadow');
        btnMap.classList.remove('text-slate-300');
        btnGlobe.classList.remove('bg-cyan-500', 'text-white', 'shadow');
        btnGlobe.classList.add('text-slate-300');

        headerIcon.className = "fa-solid fa-map-location-dot text-xs text-cyan-300";
        subtitle.innerText = "Zoom Haute Précision (2D)";
        btnTiles.classList.remove('hidden');
        btnRotate.classList.add('hidden');

        if (!myLeafletMap) {
          initLeafletMap([lat, lng], zoom);
        } else {
          myLeafletMap.invalidateSize();
          myLeafletMap.setView([lat, lng], zoom, { animate: false });
        }
      } else {
        let lat = targetCoords ? targetCoords.lat : 27.2579;
        let lng = targetCoords ? normalizeLongitude(targetCoords.lng) : 33.8116;
        let altitude = targetCoords && targetCoords.altitude ? targetCoords.altitude : 2.1;

        mapView.classList.replace('opacity-100', 'opacity-0');
        mapView.classList.replace('pointer-events-none', 'pointer-events-auto');
        globeView.classList.replace('opacity-0', 'opacity-100');
        globeView.classList.replace('opacity-100', 'opacity-100');
        globeView.classList.replace('pointer-events-none', 'pointer-events-auto');

        btnGlobe.classList.add('bg-cyan-500', 'text-white', 'shadow');
        btnGlobe.classList.remove('text-slate-300');
        btnMap.classList.remove('bg-cyan-500', 'text-white', 'shadow');
        btnMap.classList.add('text-slate-300');

        headerIcon.className = "fa-solid fa-earth-africa text-xs";
        subtitle.innerText = "Vue planétaire 3D";
        btnTiles.classList.add('hidden');
        btnRotate.classList.remove('hidden');

        if (myGlobe) {
          setTimeout(onWindowResize, 100);
          myGlobe.pointOfView({ lat: lat, lng: lng, altitude: altitude }, 1000);
        }
      }
      updateSpotToggleButton();
    }

    function triggerManualMapSwitch() {
      const target = getExactGlobeCenterCoords();
      setViewingMode('map', target, 9);
    }

    function selectSpot(spot) {
      currentSelectedSpot = spot;
      const card = document.getElementById('destination-card');
      const flagEl = document.getElementById('card-flag');
      const regionEl = document.getElementById('card-country-region');
      const img = document.getElementById('card-img');
      const tagsContainer = document.getElementById('card-photo-tags');
      const title = document.getElementById('card-title');
      const location = document.getElementById('card-location');
      const desc = document.getElementById('card-description');
      const visiter = document.getElementById('card-visiter');
      const link = document.getElementById('card-link');

      flagEl.innerText = spot.flag || '📍';
      regionEl.innerText = `${spot.country} · ${spot.region || 'Région non spécifiée'}`;
      img.src = spot.image;
      tagsContainer.innerHTML = '';

      let spotCategories = [];
      if (spot.counts) {
        Object.keys(spot.counts).forEach(k => {
          if (CATEGORIES[k]) spotCategories.push(k);
        });
      }
      if (spotCategories.length === 0 && spot.category) {
        spotCategories.push(spot.category);
      }

      spotCategories.forEach(catKey => {
        const cat = CATEGORIES[catKey];
        if (!cat) return;
        const tag = document.createElement('div');
        tag.className = 'px-2.5 py-1 rounded-lg text-[10px] font-bold text-white uppercase tracking-wider shadow flex items-center gap-1.5 border border-white/20';
        tag.style.backgroundColor = cat.color;
        tag.innerHTML = `<i class="fa-solid ${cat.icon}"></i><span>${cat.label}</span>`;
        tagsContainer.appendChild(tag);
      });

      title.innerText = spot.name;
      location.querySelector('span').innerText = `${spot.lat.toFixed(4)}°N, ${spot.lng.toFixed(4)}°E`;
      desc.innerText = spot.description;
      visiter.innerText = spot.visiter || "Aucun détail complémentaire renseigné pour ce site.";
      link.href = spot.link;

      updateSpotToggleButton();
      card.classList.remove('hidden');

      if (currentMode === 'globe' && myGlobe) {
        myGlobe.pointOfView({ lat: spot.lat, lng: spot.lng, altitude: 0.35 }, 1000);
      } else if (currentMode === 'map' && myLeafletMap) {
        myLeafletMap.flyTo([spot.lat, spot.lng], 13, { duration: 1.0 });
      }
    }

    function closeSpotCard() {
      currentSelectedSpot = null;
      document.getElementById('destination-card').classList.add('hidden');
    }

    function toggleCurrentSpotViewMode() {
      if (currentMode === 'globe') {
        if (currentSelectedSpot) {
          setViewingMode('map', { lat: currentSelectedSpot.lat, lng: currentSelectedSpot.lng }, 13);
        } else {
          triggerManualMapSwitch();
        }
      } else {
        closeSpotCard();
        setViewingMode('globe', { lat: 27.2579, lng: 33.8116, altitude: 2.1 });
      }
    }

    function updateSpotToggleButton() {
      const btnIcon = document.getElementById('card-btn-icon');
      const btnLabel = document.getElementById('card-btn-label');
      if (!btnIcon || !btnLabel) return;
      if (currentMode === 'globe') {
        btnIcon.className = "fa-solid fa-map-location-dot text-cyan-400 text-[10px]";
        btnLabel.innerText = "Explorer en 2D";
      } else {
        btnIcon.className = "fa-solid fa-globe text-cyan-400 text-[10px]";
        btnLabel.innerText = "Observer en 3D";
      }
    }

    function flyToSpotCoordinates(lat, lng, zoom2D = 12) {
      if (currentMode === 'map') {
        if (myLeafletMap) myLeafletMap.flyTo([lat, lng], zoom2D, { duration: 1.2 });
      } else {
        if (myGlobe) myGlobe.pointOfView({ lat: lat, lng: lng, altitude: 0.35 }, 1200);
      }
    }

    function resetGlobalView() {
      closeSpotCard();
      setViewingMode('globe', { lat: 27.2579, lng: 33.8116, altitude: 2.1 });
    }

    function spotMatchesActiveFilters(spot) {
      let matched = false;
      if (spot.counts) {
        Object.keys(spot.counts).forEach(catKey => {
          if (CATEGORIES[catKey] && CATEGORIES[catKey].active) {
            matched = true;
          }
        });
      }
      if (!matched && spot.category && CATEGORIES[spot.category] && CATEGORIES[spot.category].active) {
        matched = true;
      }
      return matched;
    }

    function getFirstActiveCategoryForSpot(spot) {
      if (spot.counts) {
        for (let catKey of Object.keys(spot.counts)) {
          if (CATEGORIES[catKey] && CATEGORIES[catKey].active) {
            return catKey;
          }
        }
      }
      if (spot.category && CATEGORIES[spot.category] && CATEGORIES[spot.category].active) {
        return spot.category;
      }
      return spot.category;
    }

    function getFilteredSpots() {
      return travelSpots.filter(spot => spotMatchesActiveFilters(spot));
    }

    function updateGlobeDisplay() {
      if (!myGlobe) return;
      
      const filteredSpots = getFilteredSpots();
      const pov = myGlobe.pointOfView();
      const clusterMap = new Map();
      const finalElements = [];

      const shouldCluster = pov && pov.altitude > 0.35;

      if (shouldCluster) {
        filteredSpots.forEach(spot => {
          const key = `${Math.round(spot.lat * 1.5)},${Math.round(spot.lng * 1.5)}`;
          if (!clusterMap.has(key)) {
            clusterMap.set(key, []);
          }
          clusterMap.get(key).push(spot);
        });

        clusterMap.forEach((group) => {
          if (group.length > 1) {
            let avgLat = group.reduce((sum, s) => sum + s.lat, 0) / group.length;
            let avgLng = group.reduce((sum, s) => sum + s.lng, 0) / group.length;
            finalElements.push({
              isCluster: true,
              lat: avgLat,
              lng: avgLng,
              count: group.length,
              spots: group
            });
          } else {
            finalElements.push({ spot: group[0], lat: group[0].lat, lng: group[0].lng });
          }
        });
      } else {
        filteredSpots.forEach(spot => finalElements.push({ spot: spot, lat: spot.lat, lng: spot.lng }));
      }

      myGlobe.htmlElementsData(finalElements);
      updateStats();
    }

    function renderUnifiedCategoryList() {
      const container = document.getElementById('unified-category-list');
      if (!container) return;
      container.innerHTML = '';

      let lastSection = null;

      Object.keys(CATEGORIES).forEach(key => {
        const cat = CATEGORIES[key];

        if (cat.section !== lastSection) {
          lastSection = cat.section;
          if (container.children.length > 0) {
            const sep = document.createElement('div');
            sep.className = 'w-full h-[1px] bg-slate-700/80 my-2';
            container.appendChild(sep);
          }
          const sectionHeader = document.createElement('div');
          sectionHeader.className = 'text-[10px] font-bold uppercase tracking-wider flex items-center gap-1.5 px-2.5 py-1 rounded';
          if (lastSection === 'culture') {
            sectionHeader.className += ' text-amber-500 bg-amber-950/50 border border-amber-600/30';
            sectionHeader.innerHTML = '<i class="fa-solid fa-landmark"></i> Culture';
          } else {
            sectionHeader.className += ' text-cyan-400 bg-cyan-950/50 border border-cyan-600/30';
            sectionHeader.innerHTML = '<i class="fa-solid fa-water"></i> Nature';
          }
          container.appendChild(sectionHeader);
        }

        let count = 0;
        travelSpots.forEach(s => {
          if (s.counts && typeof s.counts[key] === 'number') {
            count += s.counts[key];
          } else if (s.category === key) {
            count += 1;
          }
        });

        const row = document.createElement('label');
        row.className = 'flex items-center justify-between p-1.5 rounded-lg bg-slate-900/60 hover:bg-slate-800/80 cursor-pointer transition select-none border border-slate-800/60';
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <input type="checkbox" ${cat.active ? 'checked' : ''} onchange="toggleCategory('${key}')" class="w-3.5 h-3.5 rounded text-cyan-500 bg-slate-800 border-slate-700 focus:ring-0 cursor-pointer">
            <div class="w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] shrink-0 shadow" style="background-color: ${cat.color};">
              <i class="fa-solid ${cat.icon}"></i>
            </div>
            <span class="text-slate-200 text-[11px] font-medium truncate">${cat.label}</span>
          </div>
          <span class="font-mono font-bold text-[10px] px-1.5 py-0.5 rounded bg-slate-950/60 border border-slate-800 ${count > 0 ? 'text-white' : 'text-slate-500'}">${count}</span>
        `;
        container.appendChild(row);
      });
    }

    function toggleCategory(key) {
      if (CATEGORIES[key]) {
        CATEGORIES[key].active = !CATEGORIES[key].active;
        updateGlobeDisplay();
        updateLeafletDisplay();
        updateStats();
      }
    }

    function setAllFilters(state) {
      Object.keys(CATEGORIES).forEach(k => {
        CATEGORIES[k].active = state;
      });
      renderUnifiedCategoryList();
      updateGlobeDisplay();
      updateLeafletDisplay();
      updateStats();
    }

    function updateStats() {
      let totalSites = travelSpots.length;
      const statSitesEl = document.getElementById('header-stat-sites');
      if (statSitesEl) statSitesEl.innerText = totalSites;

      const uniqueCountries = new Set(travelSpots.map(s => s.country)).size;
      const statCountriesEl = document.getElementById('header-stat-countries');
      if (statCountriesEl) statCountriesEl.innerText = uniqueCountries;
    }

    function zoomMapIn() {
      if (currentMode === 'map' && myLeafletMap) {
        myLeafletMap.zoomIn();
      } else if (myGlobe) {
        const pov = myGlobe.pointOfView();
        const nextAlt = pov.altitude - 0.35;
        if (nextAlt <= 0.28) {
          const target = activeCursorCoords || getExactGlobeCenterCoords();
          setViewingMode('map', target, 9);
        } else {
          myGlobe.pointOfView({ altitude: nextAlt }, 350);
        }
      }
    }

    function zoomMapOut() {
      if (currentMode === 'map' && myLeafletMap) {
        if (myLeafletMap.getZoom() <= 4) {
          const center = myLeafletMap.getCenter();
          setViewingMode('globe', { lat: center.lat, lng: center.lng, altitude: 2.1 });
        } else {
          myLeafletMap.zoomOut();
        }
      } else if (myGlobe) {
        const pov = myGlobe.pointOfView();
        myGlobe.pointOfView({ altitude: Math.min(3.5, pov.altitude + 0.35) }, 350);
      }
    }

    function toggleMapTileLayer() {
      if (!myLeafletMap || !currentTileLayerInstance) return;
      myLeafletMap.removeLayer(currentTileLayerInstance);
      if (activeTileLayerKey === 'satellite') {
        activeTileLayerKey = 'topo';
        currentTileLayerInstance = L.tileLayer(TILE_LAYERS.topo.url, { maxZoom: 17 }).addTo(myLeafletMap);
      } else {
        activeTileLayerKey = 'satellite';
        currentTileLayerInstance = L.tileLayer(TILE_LAYERS.satellite.url, { maxZoom: 18 }).addTo(myLeafletMap);
      }
    }

    function toggleGlobeAutoRotate() {
      if (!myGlobe) return;
      isAutoRotating = !isAutoRotating;
      myGlobe.controls().autoRotate = isAutoRotating;
      updateAutoRotateIcon();
    }

    function updateAutoRotateIcon() {
      const icon = document.getElementById('icon-auto-rotate');
      if (icon) icon.className = isAutoRotating ? "fa-solid fa-pause text-xs" : "fa-solid fa-play text-xs";
    }

    function onWindowResize() {
      const container = document.getElementById('globe-container');
      if (myGlobe && container) {
        myGlobe.width(container.clientWidth);
        myGlobe.height(container.clientHeight);
      }
      if (myLeafletMap) myLeafletMap.invalidateSize();
    }

    window.addEventListener('resize', onWindowResize);
    window.onload = function () {
      initGlobe();
      renderUnifiedCategoryList();
      updateStats();
      setTimeout(onWindowResize, 200);
    };
  </script>
</body>
</html>
